
<!DOCTYPE html>
<html lang="es">
<head>
<link rel="manifest" href="./manifiesto.json">
<meta name="theme-color" content="#101114">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="La Vagancia">
<link rel="apple-touch-icon" href="./icon-192%20(1).png">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>La Vagancia Letras</title>
  <script type="module" src="./firebase.js"></script>

<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  background: #101114;
  color: white;
  font-family: Arial, sans-serif;
}

header {
  background: #1c1e23;
  text-align: center;
  padding: 25px 12px;
}

h1 {
  color: #f0c46b;
  margin: 0;
}

header p { color: #aaa; }

main {
  padding: 18px;
  max-width: 950px;
  margin: auto;
}

input, textarea {
  width: 100%;
  padding: 14px;
  margin: 8px 0;
  border: 1px solid #444;
  border-radius: 9px;
  background: #202228;
  color: white;
  font-size: 16px;
}

textarea { min-height: 180px; }

button {
  background: #d7a94d;
  color: #171717;
  border: 0;
  padding: 13px;
  border-radius: 9px;
  font-size: 15px;
  font-weight: bold;
  cursor: pointer;
}

button:hover { background: #f0c46b; }

button:disabled {
  opacity: .5;
  cursor: wait;
}

.menu {
  display: flex;
  gap: 8px;
  margin: 12px 0;
}

.menu button { flex: 1; }

.acciones {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  margin: 12px 0;
}

.song {
  background: #1d1f24;
  padding: 17px;
  margin: 12px 0;
  border: 1px solid #383838;
  border-radius: 12px;
}

.song h3 {
  color: #f0c46b;
  margin: 0 0 6px;
}

.song p { color: #bbb; }

.preview {
  white-space: pre-wrap;
  color: #ddd !important;
  line-height: 1.5;
}

pre {
  white-space: pre-wrap;
  overflow-wrap: anywhere;
  font-family: Arial, sans-serif;
  font-size: 17px;
  line-height: 1.8;
}

#mensaje {
  color: #bbb;
  padding: 10px 0;
}

.oculto { display: none; }

#detalle {
  background: #1d1f24;
  padding: 20px;
  border-radius: 12px;
}

#detalle h2 { color: #f0c46b; }

#detalleArtista { color: #bbb; }

.etiqueta {
  font-size: 13px;
  color: #aaa;
}

@media(max-width: 500px) {
  .menu button { font-size: 13px; }
  .acciones button { flex: 1; }
}
</style>
</head>

<body>

<header>
  <h1>🎵 La Vagancia Letras</h1>
  <p>Encuentra, lee y guarda tus canciones favoritas</p>
</header>

<main>

<section id="inicio">

  <input
    id="buscar"
    type="search"
    placeholder="Nombre de canción o artista..."
  >

  <div class="menu">
    <button onclick="cambiarVista('todas')">
      Canciones
    </button>
    <button onclick="cambiarVista('biblioteca')">
      Mi biblioteca
    </button>
  </div>

  <div class="acciones">
    <button id="botonBuscar" onclick="buscarInternet()">
      🔎 Buscar letras en internet
    </button>

    <button onclick="agregarCancion()">
     + Agregar canción
    </button>
  </div>

  <p id="mensaje"></p>
  <div id="lista"></div>

</section>

<section id="detalle" class="oculto">

  <button onclick="regresar()">
    ← Volver a canciones
  </button>

  <h2 id="detalleTitulo"></h2>
  <p id="detalleArtista"></p>

  <div class="acciones">
    <button id="detalleGuardar">
      Guardar en biblioteca
    </button>
  </div>

  <pre id="detalleLetra"></pre>

</section>

</main>

<script>
const buscar = document.getElementById("buscar");
const lista = document.getElementById("lista");
const mensaje = document.getElementById("mensaje");
const botonBuscar = document.getElementById("botonBuscar");

function leerGuardado(clave) {
  try {
    const valor = JSON.parse(localStorage.getItem(clave));
    return Array.isArray(valor) ? valor : [];
  } catch {
    return [];
  }
}

function normalizar(texto) {
  return String(texto || "")
    .normalize("NFD")
    .replace(/[\u0300-\u036f]/g, "")
    .toLowerCase()
    .replace(/[^a-z0-9 ]/g, " ")
    .replace(/\s+/g, " ")
    .trim();
}

function limpiarSincronizada(texto) {
  return String(texto || "")
    .replace(/\[\d{2}:\d{2}(?:\.\d+)?\]/g, "")
    .trim();
}

let canciones = leerGuardado("misCanciones")
  .filter(c => c && c.titulo && c.artista);

let guardadas = leerGuardado("biblioteca");

let resultadosInternet = [];
  let cancionesFirebase = [];
let vista = "todas";
let detalleActual = null;
let buscando = false;

function guardarDatos() {
  try {
    localStorage.setItem(
      "misCanciones",
      JSON.stringify(canciones)
    );
    localStorage.setItem(
      "biblioteca",
      JSON.stringify(guardadas)
    );
    return true;
  } catch {
    alert("No se pudo guardar. Revisa el espacio del navegador.");
    return false;
  }
}

function cambiarVista(nuevaVista) {
  vista = nuevaVista;
if (nuevaVista === "biblioteca") {
  document.getElementById("buscar").value = "";
}
  document.getElementById("detalle")
    .classList.add("oculto");

  document.getElementById("inicio")
    .classList.remove("oculto");

  dibujar();
}

function claveCancion(c) {
  return normalizar(c.titulo) + "|" +
    normalizar(c.artista);
}

function quitarDuplicados(datos) {
  const mapa = new Map();

  datos.forEach(c => {
    const clave = claveCancion(c);
    const anterior = mapa.get(clave);

    if (!anterior ||
        (!anterior.letra && c.letra) ||
        (c.letra && c.letra.length >
         (anterior.letra || "").length)) {
      mapa.set(clave, c);
    }
  });

  return [...mapa.values()];
}

function obtenerTodas() {
  return quitarDuplicados([
    ...canciones,
    ...resultadosInternet,
    ...cancionesFirebase
  ]);
}

function crearBoton(texto, accion) {
  const boton = document.createElement("button");
  boton.textContent = texto;
  boton.onclick = accion;
  return boton;
}

function dibujar() {
  const texto = normalizar(buscar.value);
  lista.innerHTML = "";

  let disponibles;

  if (vista === "biblioteca") {
    disponibles = canciones.filter(c =>
      guardadas.includes(c.id)
    );
  } else {
    disponibles = obtenerTodas();
  }

  const palabras = texto.split(" ").filter(Boolean);

  const filtradas = disponibles.filter(c => {
    const contenido = normalizar(
      c.titulo + " " + c.artista
    );

    return palabras.every(p =>
      contenido.includes(p)
    );
  });

  mensaje.textContent = filtradas.length
    ? filtradas.length + " canciones encontradas"
    : vista === "biblioteca"
      ? "No hay canciones guardadas."
      : "No hay canciones para mostrar.";

  filtradas.forEach(c => {
    const tarjeta = document.createElement("div");
    tarjeta.className = "song";

    const titulo = document.createElement("h3");
    titulo.textContent = c.titulo;

    const artista = document.createElement("p");
    artista.textContent = c.artista;

    const primeras = document.createElement("p");
    primeras.className = "preview";

    const letra = c.letra || "";

    primeras.textContent = letra
      ? "Empieza: " +
        letra.slice(0, 150) +
        (letra.length > 150 ? "..." : "")
      : "Letra no disponible.";

    const acciones = document.createElement("div");
    acciones.className = "acciones";

    acciones.appendChild(
      crearBoton(
        "Ver letra completa",
        () => verLetra(c)
      )
    );

    acciones.appendChild(
      crearBoton(
        guardadas.includes(c.id)
          ? "Quitar de biblioteca"
          : "Guardar canción",
        () => guardar(c)
      )
    );

    tarjeta.append(
      titulo,
      artista,
      primeras,
      acciones
    );

    lista.appendChild(tarjeta);
  });
}

function guardar(c) {
  if (guardadas.includes(c.id)) {
    guardadas = guardadas.filter(
      id => id !== c.id
    );
  } else {
    guardadas.push(c.id);

    if (!canciones.some(x => x.id === c.id)) {
      canciones.push(c);
    }
  }

  guardarDatos();
  dibujar();

  if (detalleActual &&
      detalleActual.id === c.id) {
    actualizarBotonDetalle();
  }
}

function actualizarBotonDetalle() {
  const boton = document.getElementById(
    "detalleGuardar"
  );

  boton.textContent =
    guardadas.includes(detalleActual.id)
      ? "Quitar de biblioteca"
      : "Guardar en biblioteca";

  boton.onclick = () => guardar(detalleActual);
}

function verLetra(c) {
  detalleActual = c;

  document.getElementById(
    "detalleTitulo"
  ).textContent = c.titulo;

  document.getElementById(
    "detalleArtista"
  ).textContent = c.artista;

  document.getElementById(
    "detalleLetra"
  ).textContent = c.letra ||
    "La letra completa no está disponible.";
  if (!c.letra) buscarLetraFaltante(c);
  actualizarBotonDetalle();

  document.getElementById("inicio")
    .classList.add("oculto");

  document.getElementById("detalle")
    .classList.remove("oculto");

  window.scrollTo(0, 0);
}


async function buscarLetraFaltante(c) {
  if (c.letra) return;

  const elemento = document.getElementById("detalleLetra");
  elemento.textContent = "Buscando letra automáticamente...";

  const normalizar = texto => (texto || "")
    .normalize("NFD")
    .replace(/[\u0300-\u036f]/g, "")
    .toLowerCase()
    .trim();

  let letraEncontrada = "";

  // Primera fuente: LRCLIB
  try {
    const url = "https://lrclib.net/api/search?" +
      "track_name=" + encodeURIComponent(c.titulo) +
      "&artist_name=" + encodeURIComponent(c.artista);

    const respuesta = await fetch(url);

    if (respuesta.ok) {
      const resultados = await respuesta.json();

      const encontrada = resultados.find(r =>
        normalizar(r.trackName) === normalizar(c.titulo) &&
        normalizar(r.artistName) === normalizar(c.artista) &&
        (r.plainLyrics || r.syncedLyrics)
      );

      if (encontrada) {
        letraEncontrada = encontrada.plainLyrics ||
          limpiarSincronizada(encontrada.syncedLyrics || "");
      }
    }
  } catch (error) {
    console.log("LRCLIB no respondió:", error);
  }

  // Segunda fuente: Lyrics.ovh
  if (!letraEncontrada) {
    if (detalleActual === c) {
      elemento.textContent = "Buscando en otra fuente...";
    }

    try {
      const url = "https://api.lyrics.ovh/v1/" +
        encodeURIComponent(c.artista) + "/" +
        encodeURIComponent(c.titulo);

      const respuesta = await fetch(url);

      if (respuesta.ok) {
        const datos = await respuesta.json();

        if (datos.lyrics && datos.lyrics.trim()) {
          letraEncontrada = datos.lyrics.trim();
        }
      }
    } catch (error) {
      console.log("Lyrics.ovh no respondió:", error);
    }
  }

  if (letraEncontrada) {
    c.letra = letraEncontrada;

    if (detalleActual === c) {
      elemento.textContent = c.letra;
    }
  } else if (detalleActual === c) {
    elemento.textContent =
      "La letra completa no está disponible en las fuentes consultadas.";
  }
}


function regresar() {
  document.getElementById("detalle")
    .classList.add("oculto");

  document.getElementById("inicio")
    .classList.remove("oculto");

  dibujar();
}

async function consultar(url) {
  const respuesta = await fetch(url);

  if (!respuesta.ok) {
    throw new Error("Error de búsqueda");
  }

  return await respuesta.json();
}

function convertirResultado(c) {
  return {
    id: "internet-" + c.id,
    titulo: c.trackName,
    artista: c.artistName,
    letra: c.plainLyrics ||
      limpiarSincronizada(c.syncedLyrics || "")
  };
}


async function buscarInternet() {
  const consulta = buscar.value.trim();

  if (!consulta) {
    alert("Escribe una canción o artista.");
    return;
  }

  if (buscando) return;

  buscando = true;
  botonBuscar.disabled = true;
  botonBuscar.textContent = "Buscando...";
  mensaje.textContent = "Buscando más canciones...";
  lista.innerHTML = "";

  try {
    const urlLetras =
      "https://lrclib.net/api/search?q=" +
      encodeURIComponent(consulta);

    const urlCatalogo =
      "https://musicbrainz.org/ws/2/recording/" +
      "?query=" + encodeURIComponent(consulta) +
      "&fmt=json&limit=50";

    const respuestas = await Promise.allSettled([
      fetch(urlLetras),
      fetch(urlCatalogo)
    ]);

    let letras = [];
    let catalogo = [];

    if (respuestas[0].status === "fulfilled" &&
        respuestas[0].value.ok) {
      letras = await respuestas[0].value.json();
    }

    if (respuestas[1].status === "fulfilled" &&
        respuestas[1].value.ok) {
      const datos = await respuestas[1].value.json();
      catalogo = datos.recordings || [];
    }

    const cancionesConLetra =
      (Array.isArray(letras) ? letras : [])
        .filter(c => c.trackName && c.artistName)
        .map(convertirResultado);

    const cancionesCatalogo = catalogo
      .filter(c => c.title)
      .map(c => {
        const artistas = (c["artist-credit"] || [])
          .filter(a => a && a.artist)
          .map(a => a.artist.name);

        return {
          id: "musicbrainz-" + c.id,
          titulo: c.title,
          artista: artistas.join(", ") ||
            "Artista desconocido",
          letra: ""
        };
      });

    resultadosInternet = quitarDuplicados([
      ...cancionesConLetra,
      ...cancionesCatalogo
    ]);

    resultadosInternet.sort((a, b) =>
      Number(Boolean(b.letra)) -
      Number(Boolean(a.letra))
    );

    vista = "todas";
    dibujar();

    if (!resultadosInternet.length) {
      mensaje.textContent =
        "No se encontraron canciones. " +
        "Prueba con otro nombre o artista.";
    }

  } catch (error) {
    mensaje.textContent =
      "Hubo un problema al buscar canciones.";
  } finally {
    buscando = false;
    botonBuscar.disabled = false;
    botonBuscar.textContent =
      "🔎 Buscar letras en internet";
  }
}


async function agregarCancion() {
  const titulo = prompt("Nombre de la canción:");

  if (!titulo || !titulo.trim()) return;

  const artista = prompt("Nombre del artista:");

  if (artista === null) return;

  const letra = prompt(
    "Pega aquí la letra completa:"
  );

  if (letra === null) return;

  const nueva = {
    id: "manual-" + Date.now(),
    titulo: titulo.trim(),
    artista: artista.trim() ||
      "Artista desconocido",
    letra: letra.trim()
  };

  canciones.push(nueva);
  guardarDatos();
if (window.enviarCancionFirebase) {
  await window.enviarCancionFirebase(nueva);
}
  vista = "todas";
  buscar.value = "";
  dibujar();

  alert("¡Canción guardada en tu biblioteca! Si iniciaste sesión con Google, también se envió a revisión.");
}

buscar.addEventListener("input", dibujar);

buscar.addEventListener("keydown", e => {
  if (e.key === "Enter") {
    buscarInternet();
  }
});

dibujar();
  
window.addEventListener("cancionesFirebaseActualizadas", () => {
  cancionesFirebase = window.cancionesFirebase || [];
  dibujar();
});

</script>

<script type="module">
import { db } from "./firebase.js";
import {
  collection, query, where, onSnapshot
} from "https://www.gstatic.com/firebasejs/13.2.0/firebase-firestore.js";

const consulta = query(
  collection(db, "canciones"),
  where("estado", "==", "aprobado")
);

onSnapshot(consulta, (resultado) => {
  window.cancionesFirebase = resultado.docs.map(doc => ({
    id: doc.id,
    ...doc.data()
  }));
  window.dispatchEvent(new Event("cancionesFirebaseActualizadas"));
}, (error) => {
  console.error("Error al cargar canciones:", error);
});
</script>

<script>
if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => {
  navigator.serviceWorker.register("./sw.js")
      .then(() => console.log("La Vagancia Letras activada"))
      .catch(error => console.log("Error:", error));
  });
}
</script>

<div id="acceso-google" style="position:fixed;bottom:20px;right:20px;z-index:9999;">
  <button id="btn-google" style="padding:12px;background:#d9aa4e;border:0;border-radius:10px;font-weight:bold;">
    Iniciar sesión con Google
  </button>
  <span id="usuario-google" style="display:none;background:#202127;padding:12px;border-radius:10px;"></span>
</div>

<script type="module">
  import { auth, googleProvider } from "./firebase.js";
  import {
    signInWithPopup,
    onAuthStateChanged
  } from "https://www.gstatic.com/firebasejs/13.2.0/firebase-auth.js";

  const boton = document.getElementById("btn-google");
  const usuario = document.getElementById("usuario-google");

  boton.addEventListener("click", async () => {
    try {
      await signInWithPopup(auth, googleProvider);
    } catch (error) {
      alert("No se pudo iniciar sesión: " + error.message);
    }
  });

  onAuthStateChanged(auth, (user) => {
    boton.style.display = user ? "none" : "inline-block";
    usuario.style.display = user ? "inline-block" : "none";
    usuario.textContent = user ? "Hola, " + (user.displayName || "músico") : "";
  });
</script>

</body>
</html>
