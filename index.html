<html lang="es">
<head>
<link rel="manifest" href="./manifest.json">
<meta name="theme-color" content="#080f20">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="La Vagancia">

<style>
* { box-sizing: border-box; }

  #inicio button[style*="position:absolute"] {
  background: transparent !important;
  color: #aaa !important;
  border: none !important;
  width: auto !important;
  padding: 4px !important;
  cursor: pointer;
}

body {
  margin: 0;
  background: #101114;
  color: white;
  font-family: Arial, sans-serif;
}

header {
  background: #1c1e23;
  text-align: center;
  padding: 25px 12px;
}

h1 {
  color: #f0c46b;
  margin: 0;
}

header p { color: #aaa; }

main {
  padding: 18px;
  max-width: 950px;
  margin: auto;
}

input, textarea {
  width: 100%;
  padding: 14px;
  margin: 8px 0;
  border: 1px solid #444;
  border-radius: 9px;
  background: #202228;
  color: white;
  font-size: 16px;
}

textarea {
  min-height: 400px;
  line-height: 1.8;
  font-size: 18px;
  white-space: pre-wrap;
  resize: vertical;
  font-family: Arial, sans-serif;
}

button {
  background: #d7a94d;
  color: #171717;
  border: 0;
  padding: 13px;
  border-radius: 9px;
  font-size: 15px;
  font-weight: bold;
  cursor: pointer;
}

button:hover { background: #f0c46b; }

button:disabled {
  opacity: .5;
  cursor: wait;
}

.menu {
  display: flex;
  gap: 8px;
  margin: 12px 0;
}

.menu button { flex: 1; }

.acciones {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  margin: 12px 0;
}

.song {
  background: #1d1f24;
  padding: 17px;
  margin: 12px 0;
  border: 1px solid #383838;
  border-radius: 12px;
}

.song h3 {
  color: #f0c46b;
  margin: 0 0 6px;
}

.song p { color: #bbb; }

.preview {
  white-space: pre-wrap;
  color: #ddd !important;
  line-height: 1.5;
}

pre {
  white-space: pre-wrap;
  overflow-wrap: anywhere;
  font-family: Arial, sans-serif;
  font-size: 17px;
  line-height: 1.8;
}

#mensaje {
  color: #bbb;
  padding: 10px 0;
}

.oculto { display: none; }

#detalle {
  background: #1d1f24;
  padding: 20px;
  border-radius: 12px;
}

#detalle h2 { color: #f0c46b; }

#detalleArtista { color: #bbb; }

.etiqueta {
  font-size: 13px;
  color: #aaa;
}

@media(max-width: 500px) {
  .menu button { font-size: 13px; }
  .acciones button { flex: 1; }
}

/* Renovación visual — no modifica lógica ni almacenamiento */
:root{color-scheme:dark;--fondo:#0b0d10;--panel:#171a20;--linea:#30343d;--oro:#e0b865;--texto:#f5f5f4;--suave:#a6aab3}
html{scroll-behavior:auto}
body{background:radial-gradient(ellipse 85% 300px at 50% 0%,#282113 0%,#111318 65%,#0b0d10 100%);color:var(--texto);font-family:system-ui,-apple-system,'Segoe UI',sans-serif;min-height:100vh}
header{background:linear-gradient(180deg,#191a1d 0%,#111318 100%);border-bottom:1px solid #3b3325;padding:34px 18px 28px}
header h1{color:var(--oro);font-size:clamp(27px,5vw,38px);letter-spacing:-.7px;font-weight:800}
header p{color:var(--suave);font-size:14px;margin:10px 0 0}
main{max-width:850px;padding:24px 16px 110px}
input:not([type=range]),textarea{background:#191c22;border:1px solid #393d46;border-radius:14px;color:#f8f8f8;outline:none;transition:border-color .15s,box-shadow .15s}
input:not([type=range]):focus,textarea:focus{border-color:var(--oro);box-shadow:0 0 0 3px #e0b86522}
#buscar{padding:17px 48px 17px 18px;margin:0;font-size:16px;box-shadow:0 8px 30px #0003}
button{background:var(--oro);color:#15130f;border-radius:12px;padding:13px 17px;font-family:inherit;font-size:14px;font-weight:750;transition:background .15s,transform .15s}
button:active{transform:scale(.985)}
button:hover{background:#f2ca7b}
button:focus-visible{outline:2px solid #fff;outline-offset:3px}
.menu{background:#1b1e24;border:1px solid #34373e;padding:5px;border-radius:15px;margin:18px 0 14px;gap:5px}
.menu button{background:transparent;color:#d4d5d8;border-radius:10px;padding:14px 8px}
.menu button:hover{background:#33302a;color:#f5d38c}
.acciones{gap:10px;margin:15px 0}
.acciones button{flex:1 1 190px}
#botonBuscar{background:#242830;border:1px solid #48413a;color:#f3d395}
#botonBuscar:hover{background:#34302b}
#mensaje{font-size:13px;color:var(--suave);padding:10px 3px}
.song{background:linear-gradient(145deg,#202329,#181a20);border:1px solid #34373d;border-radius:17px;padding:20px;margin:13px 0;box-shadow:0 8px 22px #0002}
.song h3{color:#f1c979;font-size:19px;line-height:1.35;margin:0 0 7px}
.song p{color:#b8bac1;margin:7px 0}
.song .preview{font-size:14px;line-height:1.65;color:#d5d5d7!important;margin:14px 0;border-left:2px solid #655537;padding-left:12px}
.song .acciones{margin-bottom:0}
.song .acciones button:last-child{background:#292d35;border:1px solid #544a39;color:#f0d18e}
#detalle{background:linear-gradient(180deg,#1b1e24,#14161b);border:1px solid #34373d;border-radius:20px;padding:clamp(18px,4vw,35px);box-shadow:0 15px 40px #0003}
#detalle h2{font-size:clamp(26px,5vw,36px);line-height:1.2;color:#f1c979;margin:27px 0 6px}
#detalleArtista{font-size:15px;color:var(--suave)}
#detalleLetra{font-size:clamp(19px,3.8vw,23px);line-height:2.05;letter-spacing:.1px;color:#f2f2f2;margin:26px 0;padding:12px 0;font-family:inherit}
#controlesScroll{background:#24272e;border:1px solid #3c4048;border-radius:15px;padding:14px;margin:20px 0!important}
#controlesScroll label{font-size:13px;color:#d4d5d9}
#velocidadScroll{accent-color:var(--oro)}
#botonCorregirLetra{background:#2c3038;color:#f2d38e;border:1px solid #5d513d;width:100%}
#panel-correcciones{background:#111318!important;padding:24px 16px!important}
#panel-correcciones h2{color:var(--oro);font-size:25px}
#acceso-google{max-width:calc(100vw - 32px)}
#btn-google{background:var(--oro)!important;box-shadow:0 8px 24px #0007}
#usuario-google{border:1px solid #494039;border-radius:12px!important;box-shadow:0 8px 24px #0007}
@media(max-width:500px){header{padding:28px 14px 23px}main{padding:19px 13px 125px}.menu button{font-size:14px}.acciones button{flex:1 1 100%;padding:14px}.song{padding:17px}.song .acciones button{flex:1 1 100%}#detalle{padding:19px}#controlesScroll button{flex:1}#detalleLetra{line-height:1.9}}

/* Encabezado Cantabella: solo presentación; no cambia datos ni funciones */
header.cantabella-header {
  position:relative; overflow:hidden;
  min-height:185px; display:flex; flex-direction:column;
  justify-content:center; align-items:center;
  padding:40px 22px 35px;
  background:radial-gradient(ellipse at center,#1a3455 0%,#0a172b 66%,#070e1c 100%);
  border-bottom:1px solid #314867;
}
header.cantabella-header::before,header.cantabella-header::after {
  content:""; position:absolute; z-index:1; top:0; bottom:0;
  width:min(36vw,290px); opacity:1;
  background-image:linear-gradient(90deg,rgba(7,14,28,.10),rgba(7,14,28,.36)),url("./acordeón-cantabella-original.jpg");
  background-size:cover; background-repeat:no-repeat;
  filter:contrast(1.1) saturate(.9);
  -webkit-mask-image:linear-gradient(to right,black 40%,transparent 100%);
  mask-image:linear-gradient(to right,black 40%,transparent 100%);
}
header.cantabella-header::before {left:0;background-position:45% 48%;}
header.cantabella-header::after {
  right:0;transform:scaleX(-1);background-position:45% 48%;
}
header.cantabella-header h1 {
  position:relative; z-index:2; margin:0; color:#fff;
  font-size:clamp(25px,5.5vw,40px);font-weight:800;
  letter-spacing:.045em; line-height:1.2;
  text-shadow:0 3px 15px #020815,0 1px 3px #020815;
}
header.cantabella-header .subtitulo-marca {
  position:relative;z-index:2;color:#c9d9ef;font-size:clamp(12px,2.5vw,16px);
  letter-spacing:.42em;font-weight:600;margin:8px 0 0;padding-left:.42em;
  text-shadow:0 2px 8px #020815;
}
header.cantabella-header .descripcion-marca {
  position:relative;z-index:2;color:#a9bbd4;font-size:12px;
  margin:13px 0 0;text-shadow:0 2px 8px #020815;
}
@media(max-width:500px){
  header.cantabella-header {min-height:165px;padding:34px 12px 27px}
  header.cantabella-header::before,header.cantabella-header::after {width:36vw;opacity:.38}
  header.cantabella-header h1 {font-size:clamp(22px,6vw,30px)}
  header.cantabella-header .descripcion-marca {font-size:11px}
}

<body>

<header class="cantabella-header">
  <h1>LA VAGANCIA</h1>
  <p class="subtitulo-marca">LETRAS</p>
  <p class="descripcion-marca">Encuentra, lee y guarda tus canciones favoritas</p>
</header>

<main>

<section id="inicio">

 <div style="position:relative;"> <input
    id="buscar"
    type="search"
    placeholder="Nombre de canción o artista..."
    oninput="dibujar()"
  >
<button type="button" onclick="document.getElementById('buscar').value=''; dibujar();" style="position:absolute;right:12px;top:50%;transform:translateY(-50%);background:transparent;color:#888;border:0;font-size:24px;padding:4px;cursor:pointer;">×</button>
</div>
  <div class="menu">
    <button onclick="cambiarVista('todas')">
      Canciones
    </button>
    <button onclick="cambiarVista('biblioteca')">
      Mi biblioteca
    </button>
  </div>

  <div class="acciones">
    <button id="botonBuscar" onclick="buscarInternet()">
      🔎 Buscar letras en internet
    </button>

    <button onclick="agregarCancion()">
     + Agregar canción
    </button>
  </div>

  <p id="mensaje"></p>
  <div id="lista"></div>

</section>

<section id="detalle" class="oculto">

  <button onclick="regresar()">
    ← Volver a canciones
  </button>

  <h2 id="detalleTitulo"></h2>
  <p id="detalleArtista"></p>

  <div class="acciones">
    <button id="detalleGuardar">
      Guardar en biblioteca
    </button>
  </div>
<div id="controlesScroll" style="display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:15px 0;display:flex !important;">
  <button type="button" onclick="iniciarScroll()">▶ Iniciar</button>
  <button type="button" onclick="pausarScroll()">⏸ Pausar</button>
  <label for="velocidadScroll">Velocidad:</label>
  <input type="range" id="velocidadScroll" min="0" max="100" value="30" style="width:120px;">
</div>
  <pre id="detalleLetra"></pre>
  <button id="botonCorregirLetra" type="button">✏️ Corregir letra</button>
</section>

</main>

<script>
const buscar = document.getElementById("buscar");
const lista = document.getElementById("lista");
const mensaje = document.getElementById("mensaje");
const botonBuscar = document.getElementById("botonBuscar");

function leerGuardado(clave) {
  try {
    const valor = JSON.parse(localStorage.getItem(clave));
    return Array.isArray(valor) ? valor : [];
  } catch {
    return [];
  }
}

function normalizar(texto) {
  return String(texto || "")
    .normalize("NFD")
    .replace(/[\u0300-\u036f]/g, "")
    .toLowerCase()
    .replace(/[^a-z0-9 ]/g, " ")
    .replace(/\s+/g, " ")
    .trim();
}

function limpiarSincronizada(texto) {
  return String(texto || "")
    .replace(/\[\d{2}:\d{2}(?:\.\d+)?\]/g, "")
    .trim();
}

let canciones = leerGuardado("misCanciones")
  .filter(c => c && c.titulo && c.artista);

let guardadas = leerGuardado("biblioteca");

let resultadosInternet = [];
  let cancionesFirebase = [];
let vista = "todas";
let detalleActual = null;
let buscando = false;
let posicionBiblioteca = 0;

function guardarDatos() {
  try {
    localStorage.setItem(
      "misCanciones",
      JSON.stringify(canciones)
    );
    localStorage.setItem(
      "biblioteca",
      JSON.stringify(guardadas)
    );
    return true;
  } catch {
    alert("No se pudo guardar. Revisa el espacio del navegador.");
    return false;
  }
}

function cambiarVista(nuevaVista) {
  vista = nuevaVista;
document.getElementById("buscar").value = "";
  document.getElementById("detalle")
    .classList.add("oculto");

  document.getElementById("inicio")
    .classList.remove("oculto");

  dibujar();
}

function claveCancion(c) {
  return normalizar(c.titulo) + "|" +
    normalizar(c.artista);
}

function quitarDuplicados(datos) {
  const mapa = new Map();

  datos.forEach(c => {
    const clave = claveCancion(c);
    const anterior = mapa.get(clave);

    if (!anterior ||
        (!anterior.letra && c.letra) ||
        (c.letra && c.letra.length >
         (anterior.letra || "").length)) {
      mapa.set(clave, c);
    }
  });

  return [...mapa.values()];
}

// Firebase tiene prioridad sobre copias locales o resultados de internet.
function obtenerTodas() {
  const mapa = new Map();
  for (const c of quitarDuplicados([...canciones, ...resultadosInternet])) {
    mapa.set(claveCancion(c), c);
  }
  for (const c of cancionesFirebase) {
    mapa.set(claveCancion(c), c);
  }
  return [...mapa.values()];
}

// Conserva los IDs guardados, pero usa la letra aprobada más reciente.

function obtenerBiblioteca() {
  return obtenerTodas()
    .filter(c =>
      guardadas.includes(c.id) || canciones.some(local =>
        guardadas.includes(local.id) &&
        claveCancion(local) === claveCancion(c)
      )
    )
    .sort((a, b) =>
      a.titulo.localeCompare(b.titulo, "es", {
        sensitivity: "base"
      })
    );
}


function estaGuardada(c) {
  return guardadas.includes(c.id) || canciones.some(local =>
    guardadas.includes(local.id) && claveCancion(local) === claveCancion(c)
  );
}

function crearBoton(texto, accion) {
  const boton = document.createElement("button");
  boton.textContent = texto;
  boton.onclick = accion;
  return boton;
}

function dibujar() {
  const texto = normalizar(buscar.value);
  lista.innerHTML = "";
if (texto === "" && vista !== "biblioteca") {
    return;
}
  let disponibles;

  if (vista === "biblioteca") {
    disponibles = obtenerBiblioteca();
  } else {
    disponibles = obtenerTodas();
  }

  const palabras = texto.split(" ").filter(Boolean);

  const filtradas = disponibles.filter(c => {
    const contenido = normalizar(
      c.titulo + " " + c.artista
    );

    return palabras.every(p =>
      contenido.includes(p)
    );
  });

  mensaje.textContent = filtradas.length
    ? filtradas.length + " canciones encontradas"
    : vista === "biblioteca"
      ? "No hay canciones guardadas."
      : "No hay canciones para mostrar.";

  filtradas.forEach(c => {
    const tarjeta = document.createElement("div");
    tarjeta.className = "song";

    const titulo = document.createElement("h3");
    titulo.textContent = c.titulo;

    const artista = document.createElement("p");
    artista.textContent = c.artista;

    const primeras = document.createElement("p");
    primeras.className = "preview";

    const letra = c.letra || "";

    primeras.textContent = letra
      ? "Empieza: " +
        letra.slice(0, 150) +
        (letra.length > 150 ? "..." : "")
      : "Letra no disponible.";

    const acciones = document.createElement("div");
    acciones.className = "acciones";

    acciones.appendChild(
      crearBoton(
        "Ver letra completa",
        () => verLetra(c)
      )
    );

    acciones.appendChild(
      crearBoton(
        guardadas.includes(c.id)
          ? "Quitar de biblioteca"
          : "Guardar canción",
        () => guardar(c)
      )
    );

    tarjeta.append(
      titulo,
      artista,
      primeras,
      acciones
    );

    lista.appendChild(tarjeta);
  });
}

function guardar(c) {
  const clave = claveCancion(c);
  const idsRelacionados = new Set([c.id, ...canciones
    .filter(x => claveCancion(x) === clave).map(x => x.id)]);
  if (estaGuardada(c)) {
    guardadas = guardadas.filter(id => !idsRelacionados.has(id));
  } else {
    guardadas.push(c.id);
    if (!canciones.some(x => x.id === c.id)) canciones.push({...c});
  }
  guardarDatos();
  if (window.sincronizarBiblioteca) window.sincronizarBiblioteca();
  dibujar();
  if (detalleActual && claveCancion(detalleActual) === clave) {
    actualizarBotonDetalle();
  }
}

function actualizarBotonDetalle() {
  const boton = document.getElementById("detalleGuardar");
  boton.textContent = estaGuardada(detalleActual)
    ? "Quitar de biblioteca" : "Guardar en biblioteca";
  boton.onclick = () => guardar(detalleActual);
}

function verLetra(c) {
  window.cancionParaRegresar = claveCancion(c);
  posicionBiblioteca = window.scrollY;
  detalleActual = c;

  window.detalleActual = c;
  document.getElementById(
    "detalleTitulo"
  ).textContent = c.titulo;

  document.getElementById(
    "detalleArtista"
  ).textContent = c.artista;

  document.getElementById(
    "detalleLetra"
  ).textContent = c.letra ||
    "La letra completa no está disponible.";
  if (!c.letra) buscarLetraFaltante(c);
  actualizarBotonDetalle();

  document.getElementById("inicio")
    .classList.add("oculto");

  document.getElementById("detalle")
    .classList.remove("oculto");

  window.scrollTo(0, 0);
}


async function buscarLetraFaltante(c) {
  if (c.letra) return;

  const elemento = document.getElementById("detalleLetra");
  elemento.textContent = "Buscando letra automáticamente...";

  const normalizar = texto => (texto || "")
    .normalize("NFD")
    .replace(/[\u0300-\u036f]/g, "")
    .toLowerCase()
    .trim();

  let letraEncontrada = "";

  // Primera fuente: LRCLIB
  try {
    const url = "https://lrclib.net/api/search?" +
      "track_name=" + encodeURIComponent(c.titulo) +
      "&artist_name=" + encodeURIComponent(c.artista);

    const respuesta = await fetch(url);

    if (respuesta.ok) {
      const resultados = await respuesta.json();

      const encontrada = resultados.find(r =>
        normalizar(r.trackName) === normalizar(c.titulo) &&
        normalizar(r.artistName) === normalizar(c.artista) &&
        (r.plainLyrics || r.syncedLyrics)
      );

      if (encontrada) {
        letraEncontrada = encontrada.plainLyrics ||
          limpiarSincronizada(encontrada.syncedLyrics || "");
      }
    }
  } catch (error) {
    console.log("LRCLIB no respondió:", error);
  }

  // Segunda fuente: Lyrics.ovh
  if (!letraEncontrada) {
    if (detalleActual === c) {
      elemento.textContent = "Buscando en otra fuente...";
    }

    try {
      const url = "https://api.lyrics.ovh/v1/" +
        encodeURIComponent(c.artista) + "/" +
        encodeURIComponent(c.titulo);

      const respuesta = await fetch(url);

      if (respuesta.ok) {
        const datos = await respuesta.json();

        if (datos.lyrics && datos.lyrics.trim()) {
          letraEncontrada = datos.lyrics.trim();
        }
      }
    } catch (error) {
      console.log("Lyrics.ovh no respondió:", error);
    }
  }

  if (letraEncontrada) {
    c.letra = letraEncontrada;

    if (detalleActual === c) {
      elemento.textContent = c.letra;
    }
  } else if (detalleActual === c) {
    elemento.textContent =
      "La letra completa no está disponible en las fuentes consultadas.";
  }
}


function regresar() {
  pausarScroll();

  document.getElementById("detalle")
    .classList.add("oculto");

  document.getElementById("inicio")
    .classList.remove("oculto");

  dibujar();

  const tarjetas = document.querySelectorAll("#lista .song");

  const cancionesVisibles = (vista === "biblioteca"
    ? obtenerBiblioteca()
    : obtenerTodas()
  ).filter(c => {
    const palabras = normalizar(buscar.value).split(" ").filter(Boolean);
    const contenido = normalizar(c.titulo + " " + c.artista);
    return palabras.every(p => contenido.includes(p));
  });

  const indice = cancionesVisibles.findIndex(c =>
    claveCancion(c) === window.cancionParaRegresar
  );

  requestAnimationFrame(() => {
    if (indice >= 0 && tarjetas[indice]) {
      tarjetas[indice].scrollIntoView({
        behavior: "instant",
        block: "center"
      });
    }
  });
}

async function consultar(url) {
  const respuesta = await fetch(url);

  if (!respuesta.ok) {
    throw new Error("Error de búsqueda");
  }

  return await respuesta.json();
}

function convertirResultado(c) {
  return {
    id: "internet-" + c.id,
    titulo: c.trackName,
    artista: c.artistName,
    letra: c.plainLyrics ||
      limpiarSincronizada(c.syncedLyrics || "")
  };
}


async function buscarInternet() {
  const consulta = buscar.value.trim();

  if (!consulta) {
    alert("Escribe una canción o artista.");
    return;
  }

  if (buscando) return;

  buscando = true;
  botonBuscar.disabled = true;
  botonBuscar.textContent = "Buscando...";
  mensaje.textContent = "Buscando más canciones...";
  lista.innerHTML = "";

  try {
    const urlLetras =
      "https://lrclib.net/api/search?q=" +
      encodeURIComponent(consulta);

    const urlCatalogo =
      "https://musicbrainz.org/ws/2/recording/" +
      "?query=" + encodeURIComponent(consulta) +
      "&fmt=json&limit=50";

    const respuestas = await Promise.allSettled([
      fetch(urlLetras),
      fetch(urlCatalogo)
    ]);

    let letras = [];
    let catalogo = [];

    if (respuestas[0].status === "fulfilled" &&
        respuestas[0].value.ok) {
      letras = await respuestas[0].value.json();
    }

    if (respuestas[1].status === "fulfilled" &&
        respuestas[1].value.ok) {
      const datos = await respuestas[1].value.json();
      catalogo = datos.recordings || [];
    }

    const cancionesConLetra =
      (Array.isArray(letras) ? letras : [])
        .filter(c => c.trackName && c.artistName)
        .map(convertirResultado);

    const cancionesCatalogo = catalogo
      .filter(c => c.title)
      .map(c => {
        const artistas = (c["artist-credit"] || [])
          .filter(a => a && a.artist)
          .map(a => a.artist.name);

        return {
          id: "musicbrainz-" + c.id,
          titulo: c.title,
          artista: artistas.join(", ") ||
            "Artista desconocido",
          letra: ""
        };
      });

    resultadosInternet = quitarDuplicados([
      ...cancionesConLetra,
      ...cancionesCatalogo
    ]);

    resultadosInternet.sort((a, b) =>
      Number(Boolean(b.letra)) -
      Number(Boolean(a.letra))
    );

    vista = "todas";
    dibujar();

    if (!resultadosInternet.length) {
      mensaje.textContent =
        "No se encontraron canciones. " +
        "Prueba con otro nombre o artista.";
    }

  } catch (error) {
    mensaje.textContent =
      "Hubo un problema al buscar canciones.";
  } finally {
    buscando = false;
    botonBuscar.disabled = false;
    botonBuscar.textContent =
      "🔎 Buscar letras en internet";
  }
}


function abrirEditorLetra(tituloCancion, letraActual = "") {
  return new Promise((resolver) => {
    const fondo = document.createElement("div");
    fondo.style.cssText = "position:fixed;inset:0;background:#000b;z-index:99999;display:flex;align-items:center;justify-content:center;padding:15px;";

    const cuadro = document.createElement("div");
    cuadro.style.cssText = "background:#202127;color:white;padding:20px;border-radius:12px;width:100%;max-width:650px;max-height:90vh;overflow:auto;";

    const titulo = document.createElement("h2");
    titulo.textContent = tituloCancion || "Editar letra de la canción";

    const instrucciones = document.createElement("p");
    instrucciones.textContent = "Separa las estrofas dejando una línea vacía.";

    const editor = document.createElement("textarea");
    editor.rows = 14;
    editor.value = letraActual;
    editor.placeholder = "Primera estrofa...\n\nSegunda estrofa...\n\n[Instrumental]\n\nTercera estrofa...";
    editor.style.cssText = "width:100%;box-sizing:border-box;padding:12px;font-size:17px;line-height:1.6;border-radius:8px;resize:vertical;";

    const guardar = document.createElement("button");
    guardar.textContent = "Guardar letra";

    const cancelar = document.createElement("button");
    cancelar.textContent = "Cancelar";
    cancelar.style.marginLeft = "10px";

    guardar.onclick = () => {
      if (!editor.value.trim()) {
        alert("Escribe la letra de la canción.");
        return;
      }
      fondo.remove();
      resolver(editor.value);
    };

    cancelar.onclick = () => {
      fondo.remove();
      resolver(null);
    };

    cuadro.append(titulo, instrucciones, editor, guardar, cancelar);
    fondo.appendChild(cuadro);
    document.body.appendChild(fondo);
    editor.focus();
  });
}

async function agregarCancion() {
  const titulo = prompt("Nombre de la canción:");

  if (!titulo || !titulo.trim()) return;

  const artista = prompt("Nombre del artista:");

  if (artista === null) return;

  const letra = await abrirEditorLetra();

  if (letra === null) return;

  const nueva = {
    id: "manual-" + Date.now(),
    titulo: titulo.trim(),
    artista: artista.trim() ||
      "Artista desconocido",
    letra: letra.trim()
  };

  canciones.push(nueva);
  guardarDatos();
if (window.enviarCancionFirebase) {
  await window.enviarCancionFirebase(nueva);
}
  vista = "todas";
  buscar.value = "";
  dibujar();

  alert("¡Canción guardada en tu biblioteca! Si iniciaste sesión con Google, también se envió a revisión.");
}

buscar.addEventListener("input", dibujar);

buscar.addEventListener("keydown", e => {
  if (e.key === "Enter") {
    buscarInternet();
  }
});

dibujar();
  
window.addEventListener("cancionesFirebaseActualizadas", () => {
  cancionesFirebase = window.cancionesFirebase || [];
  // Actualizar copias locales para que también funcionen sin internet.
  let cambio = false;
  for (const remota of cancionesFirebase) {
    for (let i = 0; i < canciones.length; i++) {
      const local = canciones[i];
      if (local.id === remota.id || claveCancion(local) === claveCancion(remota)) {
        if (local.letra !== remota.letra) {
          canciones[i] = {...local, letra: remota.letra};
          cambio = true;
        }
      }
    }
  }
  if (cambio) guardarDatos();
  // Refrescar la canción abierta sin cerrar la pantalla.
  if (detalleActual) {
    const nueva = cancionesFirebase.find(c =>
      c.id === detalleActual.id || claveCancion(c) === claveCancion(detalleActual)
    );
    if (nueva) {
      detalleActual = nueva;
      window.detalleActual = nueva;
      document.getElementById("detalleLetra").textContent = nueva.letra ||
        "La letra completa no está disponible.";
      actualizarBotonDetalle();
    }
  }
  dibujar();
});

</script>

<!-- Sincronización privada de bibliotecas: Google + Firestore -->
<script type="module">
import { auth, db } from "./firebase.js";
import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/13.2.0/firebase-auth.js";
import { doc, getDoc, setDoc } from "https://www.gstatic.com/firebasejs/13.2.0/firebase-firestore.js";

let usuarioActivo = null;
let bibliotecaPreparada = false;
let sincronizacionEnCurso = Promise.resolve();
let generacionSesion = 0;
const claveLocal = uid => "vaganciaBiblioteca_" + uid;
const clavePendiente = uid => "vaganciaPendiente_" + uid;

function cancionesDeBiblioteca() {
  const elegidas = new Map();
  for (const c of [...canciones, ...cancionesFirebase, ...resultadosInternet]) {
    if (!c || !c.id || !c.titulo || !c.artista || !estaGuardada(c)) continue;
    const clave = claveCancion(c);
    const anterior = elegidas.get(clave);
    if (!anterior || (c.letra || "").length > (anterior.letra || "").length) {
      elegidas.set(clave, {id:String(c.id), titulo:String(c.titulo),
        artista:String(c.artista), letra:String(c.letra || "")});
    }
  }
  return [...elegidas.values()];
}

function aplicarBiblioteca(datos) {
  const mapa = new Map();
  for (const c of datos) {
    if (!c || !c.id || !c.titulo || !c.artista) continue;
    mapa.set(claveCancion(c), c);
  }
  const elegidas = [...mapa.values()];
  guardadas = elegidas.map(c => c.id);
  // Guardamos también las letras para que sigan disponibles sin conexión.
  const otras = canciones.filter(c => !mapa.has(claveCancion(c)));
  canciones = [...otras, ...elegidas];
  guardarDatos();
  dibujar();
  if (detalleActual) actualizarBotonDetalle();
}

async function subirBiblioteca(uid, datos) {
  // Firestore limita cada documento a 1 MiB.
  if (JSON.stringify(datos).length > 750000) {
    console.warn("Biblioteca demasiado grande para sincronizar en un documento.");
    return false;
  }
  await setDoc(doc(db, "bibliotecas", uid), { canciones: datos });
  return true;
}

window.sincronizarBiblioteca = () => {
  if (!usuarioActivo || !bibliotecaPreparada) return;
  const uid = usuarioActivo;
  localStorage.setItem(clavePendiente(uid), "1");
  localStorage.setItem(claveLocal(uid), JSON.stringify(cancionesDeBiblioteca()));
  if (!navigator.onLine) return;
  sincronizacionEnCurso = sincronizacionEnCurso.then(async () => {
    if (usuarioActivo !== uid) return;
    const datos = JSON.parse(localStorage.getItem(claveLocal(uid)) || "[]");
    if (await subirBiblioteca(uid, datos)) localStorage.removeItem(clavePendiente(uid));
  }).catch(error => console.error("No se pudo sincronizar la biblioteca:", error));
};

async function cargarBibliotecaUsuario(user) {
  const uid = user.uid;
  const generacion = ++generacionSesion;
  usuarioActivo = uid;
  bibliotecaPreparada = false;
  // Migrar la biblioteca antigua solo una vez, a la primera cuenta Google.
  const claveMigracion = "vaganciaBibliotecaMigrada";
  const primeraMigracion = !localStorage.getItem(claveMigracion);
  const datosAnteriores = primeraMigracion ? cancionesDeBiblioteca() : [];
  const datosLocales = JSON.parse(localStorage.getItem(claveLocal(uid)) || "[]");
  const pendientes = localStorage.getItem(clavePendiente(uid)) === "1";
  const respaldo = primeraMigracion ? datosAnteriores : datosLocales;
  // Mostrar copia offline inmediatamente, sin esperar a internet.
  aplicarBiblioteca(respaldo);
  if (!navigator.onLine) {
    bibliotecaPreparada = true;
    if (primeraMigracion) {
      localStorage.setItem(claveLocal(uid), JSON.stringify(respaldo));
      localStorage.setItem(clavePendiente(uid), "1");
      localStorage.setItem(claveMigracion, uid);
    }
    return;
  }
  try {
    const referencia = doc(db, "bibliotecas", uid);
    const remoto = await getDoc(referencia);
    if (usuarioActivo !== uid || generacion !== generacionSesion) return;
    const nube = remoto.exists() && Array.isArray(remoto.data().canciones)
      ? remoto.data().canciones : [];
    let finales = nube;
    if (primeraMigracion) {
      const mapa = new Map(nube.map(c => [claveCancion(c), c]));
      for (const c of respaldo) if (!mapa.has(claveCancion(c))) mapa.set(claveCancion(c), c);
      finales = [...mapa.values()];
    } else if (pendientes) {
      // Los cambios sin conexión de este dispositivo tienen prioridad.
      finales = respaldo;
    }
    aplicarBiblioteca(finales);
    localStorage.setItem(claveLocal(uid), JSON.stringify(finales));
    bibliotecaPreparada = true;
    if (primeraMigracion || pendientes || !remoto.exists()) {
      localStorage.setItem(clavePendiente(uid), "1");
      if (await subirBiblioteca(uid, finales)) localStorage.removeItem(clavePendiente(uid));
    }
    if (primeraMigracion) localStorage.setItem(claveMigracion, uid);
  } catch (error) {
    console.error("No se pudo recuperar la biblioteca:", error);
    bibliotecaPreparada = true;
    // Conservar la copia local para intentar de nuevo al recuperar conexión.
    if (primeraMigracion) {
      localStorage.setItem(claveLocal(uid), JSON.stringify(respaldo));
      localStorage.setItem(clavePendiente(uid), "1");
      localStorage.setItem(claveMigracion, uid);
    }
  }
}

onAuthStateChanged(auth, user => {
  ++generacionSesion;
  if (user && !user.isAnonymous && user.providerData.some(p => p.providerId === "google.com")) {
    cargarBibliotecaUsuario(user);
  } else {
    usuarioActivo = null;
    bibliotecaPreparada = false;
    // Sin cuenta Google, la biblioteca local sigue funcionando.
  }
});

window.addEventListener("online", () => {
  if (auth.currentUser && usuarioActivo) cargarBibliotecaUsuario(auth.currentUser);
});
</script>

<script>
let scrollAutomatico = null;
let ultimoTiempoScroll = 0;

function pausarScroll() {
  if (scrollAutomatico !== null) {
    cancelAnimationFrame(scrollAutomatico);
    scrollAutomatico = null;
  }
  ultimoTiempoScroll = 0;
}

function iniciarScroll() {
  if (scrollAutomatico !== null) return;

  ultimoTiempoScroll = 0;
let acumuladoScroll = 0;
  function mover(tiempo) {
    if (ultimoTiempoScroll) {
      const velocidad = Number(
        document.getElementById("velocidadScroll").value
      );

      const distancia = (velocidad * 0.5) *
(tiempo - ultimoTiempoScroll) / 1000;
      acumuladoScroll += distancia;
if (acumuladoScroll >= 1) {
  const pixeles = Math.floor(acumuladoScroll);
  window.scrollBy(0, pixeles);
  acumuladoScroll -= pixeles;
}

      const limite = document.documentElement.scrollHeight -
        window.innerHeight;

      if (window.scrollY >= limite - 1) {
        pausarScroll();
        return;
      }
    }

    ultimoTiempoScroll = tiempo;
    scrollAutomatico = requestAnimationFrame(mover);
  }

  scrollAutomatico = requestAnimationFrame(mover);
}
</script>


  
<div id="panel-correcciones" style="display:none;position:fixed;inset:0;background:#111;color:white;z-index:10000;overflow:auto;padding:20px;">
  <button id="cerrar-correcciones">✕ Cerrar</button>
  <h2>Correcciones pendientes</h2>
  <div id="lista-correcciones">Cargando...</div>
</div>

<script type="module">
import { auth, db } from "./firebase.js";
import {
  collection, query, where, getDocs,
  doc, getDoc, updateDoc, writeBatch
} from "https://www.gstatic.com/firebasejs/13.2.0/firebase-firestore.js";
import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/13.2.0/firebase-auth.js";

const ADMIN_UID = "hTPkZWSy0UTkH264wsmsLXV4djt2";
const panel = document.getElementById("panel-correcciones");
const lista = document.getElementById("lista-correcciones");

const acceso = document.createElement("button");
acceso.textContent = "📝 Revisar correcciones";
acceso.style.cssText = "position:fixed;bottom:75px;right:20px;z-index:9999;padding:12px;background:#d9aa4e;border:0;border-radius:10px;";
acceso.style.display = "none";
document.body.appendChild(acceso);

onAuthStateChanged(auth, user => {
  const admin = user?.uid === ADMIN_UID;
  acceso.style.display = admin ? "block" : "none";
  if (!admin) panel.style.display = "none";
});

acceso.onclick = async () => {
  if (auth.currentUser?.uid !== ADMIN_UID) return;
  panel.style.display = "block";
  await cargarCorrecciones();
};

document.getElementById("cerrar-correcciones").onclick = () => {
  panel.style.display = "none";
};

async function cargarCorrecciones() {
  lista.textContent = "Cargando...";
  try {
    const consulta = query(
      collection(db, "solicitudesEdicion"),
      where("estado", "==", "pendiente")
    );
    const resultado = await getDocs(consulta);
    lista.replaceChildren();

    if (resultado.empty) {
      lista.textContent = "No hay correcciones pendientes.";
      return;
    }

    for (const solicitud of resultado.docs) {
      const datos = solicitud.data();
      const tarjeta = document.createElement("div");
      tarjeta.style.cssText = "padding:15px;margin:12px 0;background:#292929;border-radius:10px;";

      // Las canciones de internet no tienen necesariamente un documento en Firebase.
      const idOriginal = String(datos.cancionId || "");
      const esIdExterno = /^(internet-|musicbrainz-|manual-)/.test(idOriginal);
      const referenciaOriginal = !esIdExterno && idOriginal
        ? doc(db, "canciones", idOriginal) : null;
      const cancion = referenciaOriginal ? await getDoc(referenciaOriginal) : null;
      const existeOriginal = Boolean(cancion?.exists());
      const infoOriginal = existeOriginal ? cancion.data() : {};

      const titulo = document.createElement("h3");
      titulo.textContent = datos.titulo || infoOriginal.titulo || "Identificar canción";
      const artistaTexto = document.createElement("p");
      artistaTexto.textContent = datos.artista || infoOriginal.artista || "Artista por identificar";

      const nombreInput = document.createElement("input");
      nombreInput.placeholder = "Título de la canción (obligatorio)";
      nombreInput.value = datos.titulo || infoOriginal.titulo || "";
      const artistaInput = document.createElement("input");
      artistaInput.placeholder = "Nombre del artista (obligatorio)";
      artistaInput.value = datos.artista || infoOriginal.artista || "";
      if (existeOriginal) {
        nombreInput.style.display = "none";
        artistaInput.style.display = "none";
      }

      const letra = document.createElement("pre");
      letra.textContent = datos.letraPropuesta;
      letra.style.cssText = "white-space:pre-wrap;overflow-wrap:anywhere;";

      const aprobar = document.createElement("button");
      aprobar.textContent = "✅ Aprobar";
      aprobar.disabled = false;

      const rechazar = document.createElement("button");
      rechazar.textContent = "❌ Rechazar";
      rechazar.style.marginLeft = "10px";

      aprobar.onclick = async () => {
        if (auth.currentUser?.uid !== ADMIN_UID) return;
        const nombre = (existeOriginal ? infoOriginal.titulo : nombreInput.value).trim();
        const artista = (existeOriginal ? infoOriginal.artista : artistaInput.value).trim();
        if (!nombre || !artista) {
          alert("Escribe el título y el artista antes de aprobar.");
          return;
        }
        if (!confirm("¿Aprobar la letra de " + nombre + " — " + artista + "?")) return;
        aprobar.disabled = true;
        rechazar.disabled = true;
        try {
          const lote = writeBatch(db);
          const destino = existeOriginal ? referenciaOriginal : doc(collection(db, "canciones"));
          lote.set(destino, {
            titulo: nombre,
            artista: artista,
            letra: datos.letraPropuesta,
            estado: "aprobado"
          }, { merge: true });
          lote.update(solicitud.ref, { estado: "aprobado" });
          await lote.commit();
          alert("Corrección aprobada.");
          await cargarCorrecciones();
        } catch (error) {
          aprobar.disabled = false;
          rechazar.disabled = false;
          alert("Error al aprobar: " + error.message);
        }
      };

      rechazar.onclick = async () => {
        if (auth.currentUser?.uid !== ADMIN_UID) return;
        if (!confirm("¿Rechazar esta corrección?")) return;
        try {
          await updateDoc(solicitud.ref, { estado: "rechazado" });
          await cargarCorrecciones();
        } catch (error) {
          alert("Error: " + error.message);
        }
      };

      tarjeta.append(titulo, artistaTexto, nombreInput, artistaInput, letra, aprobar, rechazar);
      lista.appendChild(tarjeta);
    }
  } catch (error) {
    lista.textContent = "Error: " + error.message;
    console.error("Error al cargar correcciones:", error);
  }
}
</script>

</body>
</html>
