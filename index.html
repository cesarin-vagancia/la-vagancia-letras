
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>La Vagancia Letras</title>
<style>
* { box-sizing: border-box; }
body {
  margin: 0;
  background: #101114;
  color: white;
  font-family: Arial, sans-serif;
}
header {
  background: #1c1e23;
  text-align: center;
  padding: 24px 12px;
}
h1 { color: #f0c46b; margin: 0; }
header p { color: #aaa; }
main { padding: 18px; max-width: 850px; margin: auto; }
input, textarea {
  width: 100%;
  padding: 14px;
  margin: 8px 0;
  border: 1px solid #444;
  border-radius: 9px;
  background: #202228;
  color: white;
  font-size: 16px;
}
textarea { min-height: 180px; }
button {
  background: #d7a94d;
  color: #171717;
  border: 0;
  padding: 13px;
  border-radius: 9px;
  font-size: 15px;
  font-weight: bold;
  cursor: pointer;
}
button:hover { background: #f0c46b; }
.menu { display: flex; gap: 8px; margin: 12px 0; }
.menu button { flex: 1; }
.acciones { display: flex; flex-wrap: wrap; gap: 8px; }
.song {
  background: #1d1f24;
  padding: 17px;
  margin: 12px 0;
  border: 1px solid #383838;
  border-radius: 12px;
}
.song h3 { color: #f0c46b; margin: 0 0 6px; }
.song p { color: #bbb; }
.preview { white-space: pre-wrap; color: #ddd; }
pre {
  white-space: pre-wrap;
  overflow-wrap: anywhere;
  font-family: Arial, sans-serif;
  font-size: 17px;
  line-height: 1.8;
}
#mensaje { color: #bbb; padding: 10px 0; }
.oculto { display: none; }
#detalle {
  background: #1d1f24;
  padding: 20px;
  border-radius: 12px;
}
#detalle h2 { color: #f0c46b; }
</style>
</head>
<body>

<header>
  <h1>🎵 La Vagancia Letras</h1>
  <p>Tus canciones y letras favoritas</p>
</header>

<main>
  <section id="inicio">
    <input id="buscar" placeholder="Buscar canción o artista...">

    <div class="menu">
      <button onclick="cambiarVista('todas')">Canciones</button>
      <button onclick="cambiarVista('biblioteca')">Mi biblioteca</button>
    </div>

    <div class="acciones">
      <button onclick="buscarInternet()">🔎 Buscar letras en internet</button>
      <button onclick="agregarCancion()">＋ Agregar canción</button>
    </div>

    <p id="mensaje"></p>
    <div id="lista"></div>
  </section>

  <section id="detalle" class="oculto">
    <button onclick="regresar()">← Volver a canciones</button>
    <h2 id="detalleTitulo"></h2>
    <p id="detalleArtista"></p>
    <div class="acciones">
      <button id="detalleGuardar">Guardar en biblioteca</button>
    </div>
    <pre id="detalleLetra"></pre>
  </section>
</main>

<script>
const buscar = document.getElementById("buscar");
const lista = document.getElementById("lista");
const mensaje = document.getElementById("mensaje");

function leerGuardado(clave, defecto) {
  try {
    const valor = JSON.parse(localStorage.getItem(clave));
    return Array.isArray(valor) ? valor : defecto;
  } catch {
    return defecto;
  }
}

let canciones = leerGuardado("misCanciones", []);
let guardadas = leerGuardado("biblioteca", []);
let vista = "todas";
let resultadosInternet = [];
let detalleActual = null;

function guardarDatos() {
  localStorage.setItem("misCanciones", JSON.stringify(canciones));
  localStorage.setItem("biblioteca", JSON.stringify(guardadas));
}

function cambiarVista(nuevaVista) {
  vista = nuevaVista;
  document.getElementById("detalle").classList.add("oculto");
  document.getElementById("inicio").classList.remove("oculto");
  dibujar();
}

function obtenerTodas() {
  const mapa = new Map();
  [...canciones, ...resultadosInternet].forEach(c => {
    mapa.set(String(c.id), c);
  });
  return [...mapa.values()];
}

function crearBoton(texto, accion) {
  const boton = document.createElement("button");
  boton.textContent = texto;
  boton.onclick = accion;
  return boton;
}

function dibujar() {
  const texto = buscar.value.toLowerCase().trim();
  lista.innerHTML = "";

  const disponibles = vista === "biblioteca"
    ? canciones.filter(c => guardadas.includes(c.id))
    : obtenerTodas();

  const filtradas = disponibles.filter(c =>
    c.titulo.toLowerCase().includes(texto) ||
    c.artista.toLowerCase().includes(texto)
  );

  mensaje.textContent = filtradas.length
    ? filtradas.length + " canciones encontradas"
    : "No hay canciones para mostrar.";

  filtradas.forEach(c => {
    const tarjeta = document.createElement("div");
    tarjeta.className = "song";

    const titulo = document.createElement("h3");
    titulo.textContent = c.titulo;

    const artista = document.createElement("p");
    artista.textContent = c.artista;

    const primeras = document.createElement("p");
    primeras.className = "preview";

    const letra = c.letra || "";
    primeras.textContent = letra
      ? "Empieza: " + letra.slice(0, 130) +
        (letra.length > 130 ? "..." : "")
      : "Letra no disponible.";

    const acciones = document.createElement("div");
    acciones.className = "acciones";

    acciones.appendChild(
      crearBoton("Ver letra completa", () => verLetra(c))
    );

    acciones.appendChild(
      crearBoton(
        guardadas.includes(c.id)
          ? "Quitar de biblioteca"
          : "Guardar canción",
        () => guardar(c)
      )
    );

    tarjeta.append(titulo, artista, primeras, acciones);
    lista.appendChild(tarjeta);
  });
}

function guardar(c) {
  if (guardadas.includes(c.id)) {
    guardadas = guardadas.filter(id => id !== c.id);
  } else {
    guardadas.push(c.id);
    if (!canciones.some(x => x.id === c.id)) {
      canciones.push(c);
    }
  }

  guardarDatos();
  dibujar();

  if (detalleActual && detalleActual.id === c.id) {
    actualizarBotonDetalle();
  }
}

function actualizarBotonDetalle() {
  const boton = document.getElementById("detalleGuardar");
  boton.textContent = guardadas.includes(detalleActual.id)
    ? "Quitar de biblioteca"
    : "Guardar en biblioteca";
  boton.onclick = () => guardar(detalleActual);
}

function verLetra(c) {
  detalleActual = c;
  document.getElementById("detalleTitulo").textContent = c.titulo;
  document.getElementById("detalleArtista").textContent = c.artista;
  document.getElementById("detalleLetra").textContent =
    c.letra || "La letra completa no está disponible.";

  actualizarBotonDetalle();

  document.getElementById("inicio").classList.add("oculto");
  document.getElementById("detalle").classList.remove("oculto");
  window.scrollTo(0, 0);
}

function regresar() {
  document.getElementById("detalle").classList.add("oculto");
  document.getElementById("inicio").classList.remove("oculto");
  dibujar();
}

async function buscarInternet() {
  const nombre = buscar.value.trim();

  if (!nombre) {
    alert("Escribe el nombre de una canción o artista.");
    return;
  }

  mensaje.textContent = "Buscando letras en internet...";
  lista.innerHTML = "";

  try {
    const url = "https://lrclib.net/api/search?q=" +
      encodeURIComponent(nombre);

    const respuesta = await fetch(url);

    if (!respuesta.ok) {
      throw new Error("Error al consultar el servicio");
    }

    const datos = await respuesta.json();

    resultadosInternet = datos
      .filter(c => c.trackName && c.artistName)
      .map(c => ({
        id: "internet-" + c.id,
        titulo: c.trackName,
        artista: c.artistName,
        letra: c.plainLyrics ||
          limpiarSincronizada(c.syncedLyrics || "")
      }));

    vista = "todas";
    dibujar();

    if (!resultadosInternet.length) {
      mensaje.textContent =
        "No se encontraron letras. Prueba con otro nombre o artista.";
    }

  } catch (error) {
    mensaje.textContent =
      "No se pudo conectar con el buscador. Intenta de nuevo.";
  }
}

function limpiarSincronizada(texto) {
  return texto
    .replace(/\[\d{2}:\d{2}(?:\.\d+)?\]/g, "")
    .trim();
}

function agregarCancion() {
  const titulo = prompt("Nombre de la canción:");
  if (!titulo || !titulo.trim()) return;

  const artista = prompt("Nombre del artista:");
  if (artista === null) return;

  const letra = prompt("Pega aquí la letra completa:");
  if (letra === null) return;

  const nueva = {
    id: "manual-" + Date.now(),
    titulo: titulo.trim(),
    artista: artista.trim() || "Artista desconocido",
    letra: letra.trim()
  };

  canciones.push(nueva);
  guardarDatos();

  vista = "todas";
  buscar.value = "";
  dibujar();

  alert("¡Canción agregada correctamente!");
}

buscar.addEventListener("input", dibujar);
dibujar();
</script>

</body>
</html>
