
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>La Vagancia Letras</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: #101114;
      color: white;
      font-family: Arial, sans-serif;
    }
    header {
      background: #1c1e23;
      padding: 25px 18px;
      text-align: center;
    }
    h1 { margin: 0; color: #f0c46b; }
    p { color: #aaa; }
    main { padding: 20px; }
    input, button {
      padding: 14px;
      border-radius: 10px;
      font-size: 16px;
    }
    input {
      width: 100%;
      background: #25272c;
      border: 1px solid #555;
      color: white;
    }
    button {
      background: #d6a94e;
      border: none;
      font-weight: bold;
      cursor: pointer;
    }
    .tabs { display: flex; gap: 8px; margin: 18px 0; }
    .tabs button { flex: 1; }
    .song {
      background: #202228;
      padding: 16px;
      border-radius: 12px;
      margin: 12px 0;
    }
    .song h3 { margin-top: 0; }
    .song button { margin: 5px 5px 0 0; }
    pre {
      white-space: pre-wrap;
      font-family: inherit;
      line-height: 1.6;
    }
  </style>
</head>
<body>
  <header>
    <h1>🎵 La Vagancia Letras</h1>
    <p>Tu biblioteca musical, siempre contigo</p>
  </header>
  <main>
    <input id="buscar" placeholder="Buscar canciones o artistas...">
    <div class="tabs">
      <button onclick="mostrar('todas')">Canciones</button>
      <button onclick="mostrar('guardadas')">Mi biblioteca</button>
    </div>
    <div id="lista"></div>
  <button onclick="agregarCancion()">➕ Agregar canción</button>
<button onclick="buscarLetraInternet()">🔎 Buscar letra en internet</button>
  </main>
  <script>
    const canciones = [
      {
        id: 1,
        titulo: "Canción de ejemplo",
        artista: "Demo",
        letra: "Aquí aparecerá la letra de la canción."
      }
];

    const misCanciones = JSON.parse(
  localStorage.getItem("misCanciones") || "[]"
);

canciones.push(...misCanciones);

    let vista = "todas";
    let guardadas = JSON.parse(
      localStorage.getItem("biblioteca") || "[]"
    );
    const lista = document.getElementById("lista");
    const buscar = document.getElementById("buscar");

    function mostrar(tipo) {
      vista = tipo;
      dibujar();
    }

    function guardar(id) {
      if (!guardadas.includes(id)) {
        guardadas.push(id);
      } else {
        guardadas = guardadas.filter(x => x !== id);
      }
      localStorage.setItem("biblioteca", JSON.stringify(guardadas));
      dibujar();
    }

    function dibujar() {
      const texto = buscar.value.toLowerCase();
      const resultado = canciones.filter(c =>
        (vista === "todas" || guardadas.includes(c.id)) &&
        (c.titulo.toLowerCase().includes(texto) ||
         c.artista.toLowerCase().includes(texto))
      );

      lista.innerHTML = "";
      resultado.forEach(c => {
        const tarjeta = document.createElement("div");
        tarjeta.className = "song";
        const titulo = document.createElement("h3");
        titulo.textContent = c.titulo;
        const artista = document.createElement("p");
        artista.textContent = c.artista;
        const letra = document.createElement("pre");
        letra.textContent = c.letra;
        const boton = document.createElement("button");
        boton.textContent = guardadas.includes(c.id)
          ? "Quitar de biblioteca" : "Guardar canción";
        boton.onclick = () => guardar(c.id);
        tarjeta.append(titulo, artista, letra, boton);
        lista.appendChild(tarjeta);
      });
      if (!resultado.length) {
        lista.textContent = "No hay canciones para mostrar.";
      }
    }

    buscar.addEventListener("input", dibujar);
    dibujar();
 function agregarCancion() {
  const titulo = prompt("Nombre de la canción:");
  if (!titulo || !titulo.trim()) return;

  const artista = prompt("Nombre del artista:");
  if (artista === null) return;

  const letra = prompt("Escribe o pega la letra:");
  if (letra === null) return;

  const nueva = {
    id: Date.now(),
    titulo: titulo.trim(),
    artista: artista.trim(),
    letra: letra
  };

  canciones.push(nueva);

  localStorage.setItem(
    "misCanciones",
    JSON.stringify(
      canciones.filter(c => c.id !== 1)
    )
  );

  vista = "todas";
  buscar.value = "";
  dibujar();

  alert("¡Canción agregada correctamente!");
}
   async function buscarLetraInternet() {
  const nombre = buscar.value.trim();

  if (!nombre) {
    alert("Escribe el nombre de una canción.");
    return;
  }

  try {
    const respuesta = await fetch(
      "https://lrclib.net/api/search?q=" +
      encodeURIComponent(nombre)
    );

    if (!respuesta.ok) throw new Error("Error de búsqueda");

    const resultados = await respuesta.json();

const opciones = resultados.filter(
  c => c.plainLyrics && c.plainLyrics.trim()
).slice(0, 10);

if (!opciones.length) {
  alert("No encontramos letras disponibles.");
  return;
}

const listaOpciones = opciones.map(
  (c, i) => `${i + 1}. ${c.trackName} - ${c.artistName}`
).join("\n");

const seleccion = prompt(
  "Elige el número de la canción:\n\n" + listaOpciones
);

if (seleccion === null) return;

const numero = Number(seleccion);

if (
  !Number.isInteger(numero) ||
  numero < 1 ||
  numero > opciones.length
) {
  alert("Selecciona un número válido.");
  return;
}

const encontrada = opciones[numero - 1];

 if (!encontrada) {
      alert("No encontramos una letra para esa canción.");
      return;
    }

    const confirmar = confirm(
      "Encontramos: " + encontrada.trackName +
      " - " + encontrada.artistName +
      "\n¿Quieres ver la letra?"
    );

    if (!confirmar) return;

    alert(encontrada.plainLyrics);

const guardarLetra = confirm(
  "⬇️ ¿Quieres guardar esta letra en Mi biblioteca?"
);

if (guardarLetra) {
  const nueva = {
    id: Date.now(),
    titulo: encontrada.trackName,
    artista: encontrada.artistName,
    letra: encontrada.plainLyrics
  };

  canciones.push(nueva);

  localStorage.setItem(
    "misCanciones",
    JSON.stringify(canciones.filter(c => c.id !== 1))
  );

  guardadas.push(nueva.id);
  localStorage.setItem(
    "biblioteca",
    JSON.stringify(guardadas)
  );

  vista = "guardadas";
  buscar.value = "";
  dibujar();

  alert("¡Letra guardada en Mi biblioteca!");
}

  } catch (error) {
    alert("No se pudo buscar. Revisa tu conexión.");
  }
}

  </script>
</body>
</html>
